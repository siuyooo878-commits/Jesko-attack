  #ui{flex:none;background:var(--panel);border-top:1px solid var(--line)}
  #transport{display:flex;align-items:center;gap:8px;padding:8px 10px}
  button,select{font:inherit;color:var(--txt);background:#1a212a;border:1px solid var(--line);border-radius:10px;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer}
  button:active{background:#242d38}
  button.on{background:#12323d;border-color:var(--acc);color:#d8f6ff}
  button.rec{background:#4a1612;border-color:#c0261c}

  .row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
  .row>label{color:var(--dim);font-size:12px;width:100%}
  .chip{min-width:40px;padding:0 10px}
  #status{color:var(--dim);font-size:12px;margin-top:6px;min-height:16px}
  @media (min-aspect-ratio:1/1) and (min-width:900px){
    #app{flex-direction:row}
    #stageWrap{flex:1}
    #ui{width:360px;border-top:0;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
    #transport{order:2;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--panel)}
    #panel{display:block!important;max-height:none;border:0;order:1}
    #btnPanel{display:none}
  }
</style>

<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   0. CONSTANTS, HELPERS, TIMELINE DATA
   Everything that moves is a pure function of ONE number: master time t.
   ===================================================================== */
const DURATION = 80;
const ASSET = 'assets/';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sstep=x=>{x=clamp(x);return x*x*(3-2*x)};
const lerp=(a,b,u)=>a+(b-a)*u;
const fract=x=>x-Math.floor(x);
const kmh=v=>v/3.6;
function kf(list,t){                       // smooth keyframe curve [[t,value],...]
  if(t<=list[0][0])return list[0][1];
  for(let i=0;i<list.length-1;i++){const a=list[i],b=list[i+1];
    if(t<b[0])return a[1]+(b[1]-a[1])*sstep((t-a[0])/(b[0]-a[0]));}
  return list[list.length-1][1];
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};

/* The user's narration, split into 11 scene lines (timestamps = voice-over guide). */
const SCENES=[
 {n:1, t0:0,  t1:6,  name:'The question',      line:"Why doesn't the Koenigsegg Jesko Attack just fly off the road at insane speeds?"},
 {n:2, t0:6,  t1:16, name:'The rear wing',     line:"Look at that massive rear wing. It might look like it's only there to make the car look aggressive, but it's actually doing something much more important."},
 {n:3, t0:16, t1:21, name:'Air pushes it down',line:"It's using the air to push the car down toward the road."},
 {n:4, t0:21, t1:29, name:'Airflow',           line:"Here's how it works. As the car speeds up, air flows around the body and over the rear wing."},
 {n:5, t0:29, t1:35, name:'Wing redirects air',line:"The wing redirects that air, creating a downward force."},
 {n:6, t0:35, t1:44, name:'Front & floor',     line:"Meanwhile, the front splitter and the shaped floor underneath help manage the airflow and keep the car balanced."},
 {n:7, t0:44, t1:49, name:'Diffuser',          line:"The diffuser helps control how air leaves from underneath."},
 {n:8, t0:49, t1:56, name:'Speed matters',     line:"And here's the crazy part. The faster the Jesko goes, the stronger that force becomes."},
 {n:9, t0:56, t1:64, name:'Published numbers', line:"Koenigsegg says it produces 700 kilograms of downforce at 250 kilometers per hour, and 1,000 kilograms at 290."},
 {n:10,t0:64, t1:74, name:'Not extra weight',  line:"That's the equivalent of pressing the car down with a force equal to roughly a tonne. It's not extra weight—it's the air helping push the tires into the road."},
 {n:11,t0:74, t1:80, name:'The payoff',        line:"And that's how the Jesko can attack corners at ridiculous speeds."},
];
const sceneAt=t=>{for(let i=SCENES.length-1;i>=0;i--)if(t>=SCENES[i].t0)return i;return 0};

/* Illustrative speed profile in km/h (drives wheel roll, road motion, flow rate, arrow size, sound). */
const SPEED_KEYS=[[0,150],[5,195],[6,215],[16,240],[21,245],[29,250],[44,250],[49.5,112],[52,112],[56,250],[58,252],[62,290],[64,292],[68,290],[72,270],[73.5,232],[74.5,225],[80,215]];
const speedKmh=t=>kf(SPEED_KEYS,t);
const flowRate=v=>3.2*(0.35+0.65*v/290);                      // visual m/s of flow beads (not physical)

const DT=1/120, NT=Math.ceil((DURATION+1)/DT);
const SD=new Float64Array(NT+2), FP=new Float64Array(NT+2);   // distance driven, flow phase (both integrals of speed)
for(let i=1;i<=NT+1;i++){const tm=(i-.5)*DT,v=speedKmh(Math.min(tm,DURATION));SD[i]=SD[i-1]+kmh(v)*DT;FP[i]=FP[i-1]+flowRate(v)*DT}
const tab=(A,t)=>{const x=clamp(t,0,DURATION+.98)/DT,i=Math.floor(x),f=x-i;return A[i]*(1-f)+A[i+1]*f};

/* Path: long straight, then one smooth sweeping left-hander (curvature ramps in/out), then straight. */
const DS=0.5, K_MAX=1/140, SC=tab(SD,73.0);
const kappaAt=s=>K_MAX*sstep((s-SC)/40)*(1-sstep((s-SC-200)/40));
const NS=Math.ceil((SD[NT]+120)/DS);
const PX=new Float64Array(NS+2),PZ=new Float64Array(NS+2),PP=new Float64Array(NS+2);
for(let i=1;i<=NS+1;i++){const s=(i-.5)*DS,p=PP[i-1]+kappaAt(s)*DS*.5;PP[i]=PP[i-1]+kappaAt(s)*DS;const pm=(PP[i]+PP[i-1])/2;PX[i]=PX[i-1]+Math.sin(pm)*DS;PZ[i]=PZ[i-1]+Math.cos(pm)*DS}
function pathAt(s){s=Math.max(0,s);const x=Math.min(s/DS,NS),i=Math.floor(x),f=x-i;return{x:PX[i]*(1-f)+PX[i+1]*f,z:PZ[i]*(1-f)+PZ[i+1]*f,psi:PP[i]*(1-f)+PP[i+1]*f}}

/* Camera keyframes in CAR-LOCAL metres: x = car's left (+), y = up, z = forward. All shots stay on the car's right side. */
const CAM_KEYS=[
 {t:0,   p:[-5.2,0.6,6.8],  q:[0,0.55,0.6],  f:50},
 {t:3,   p:[-6.6,0.8,3.2],  q:[0,0.6,0.2],   f:50},
 {t:6,   p:[-7.2,1.0,-1.2], q:[0,0.65,-0.6], f:50},
 {t:8.5, p:[-4.6,1.6,-6.2], q:[0,0.95,-1.6], f:48},
 {t:12,  p:[-3.0,1.7,-5.0], q:[0,1.0,-1.7],  f:42},
 {t:16,  p:[-3.6,1.5,-4.0], q:[0,1.0,-1.5],  f:42},
 {t:18.5,p:[-8.0,0.9,-1.0], q:[0,0.55,-0.3], f:48},
 {t:21,  p:[-8.8,1.1,1.5],  q:[0,0.6,0.1],   f:50},
 {t:25,  p:[-8.4,2.2,1.0],  q:[0,0.7,0],     f:52},
 {t:29,  p:[-6.0,2.6,-4.2], q:[0,1.0,-1.4],  f:48},
 {t:32,  p:[-4.2,1.6,-3.0], q:[0,1.0,-2.0],  f:40},
 {t:35,  p:[-5.0,1.3,-3.6], q:[0,0.9,-1.6],  f:42},
 {t:37.5,p:[-3.4,0.4,5.4],  q:[0,0.25,1.8],  f:46},
 {t:40.5,p:[-4.4,0.35,2.6], q:[0,0.2,1.2],   f:44},
 {t:44,  p:[-8.5,0.8,-0.5], q:[0,0.45,0.1],  f:50},
 {t:45.5,p:[-1.6,0.45,-6.0],q:[0,0.3,-2.2],  f:46},
 {t:49,  p:[-2.6,0.4,-4.4], q:[0,0.3,-2.0],  f:44},
 {t:52,  p:[-8.0,1.3,3.5],  q:[0,0.7,0.2],   f:50},
 {t:56,  p:[-7.0,1.4,6.0],  q:[0,0.7,0.4],   f:50},
 {t:60,  p:[-6.4,1.4,6.2],  q:[0,0.7,0.2],   f:50},
 {t:64,  p:[-7.2,1.6,5.2],  q:[0,0.65,0.1],  f:50},
 {t:68,  p:[-6.2,0.6,1.8],  q:[0,0.4,-0.2],  f:50},
 {t:72,  p:[-5.6,0.8,-5.2], q:[0,0.7,-0.8],  f:50},
 {t:74,  p:[-7.0,1.4,-6.6], q:[0,0.6,0.2],   f:50},
 {t:77,  p:[-10,2.0,-2.5],  q:[0,0.6,0.4],   f:50},
 {t:80,  p:[-6.2,1.2,6.8],  q:[0,0.65,0.3],  f:48},
];
function hermite(p0,p1,m0,m1,u){const u2=u*u,u3=u2*u;return(2*u3-3*u2+1)*p0+(u3-2*u2+u)*m0+(-2*u3+3*u2)*p1+(u3-u2)*m1}
function camAt(t,out){                     // non-uniform Catmull-Rom (cubic Hermite) over CAM_KEYS
  const K=CAM_KEYS,n=K.length;t=clamp(t,K[0].t,K[n-1].t);
  let i=0;while(i<n-2&&t>=K[i+1].t)i++;
  const a=K[i],b=K[i+1],h=b.t-a.t,u=(t-a.t)/h,pa=K[Math.max(0,i-1)],nb=K[Math.min(n-1,i+2)];
  const tan=(prev,cur,next,k,j)=>{const v0=prev===cur?cur:prev,v1=next===cur?cur:next;const dt=(next.t-prev.t)||1;return(next[k][j]-prev[k][j])/dt*h};
  for(let j=0;j<3;j++){
    out.p[j]=hermite(a.p[j],b.p[j],tan(pa,a,b,'p',j),tan(a,b,nb,'p',j),u);
    out.q[j]=hermite(a.q[j],b.q[j],tan(pa,a,b,'q',j),tan(a,b,nb,'q',j),u);
  }
  out.f=lerp(a.f,b.f,sstep(u));return out;
}
/* Narration cues for the optional browser voice preview + the sound-design transitions */
const SUN_DIR=new THREE.Vector3(0.4227,0.8526,0.3072).normalize();   // measured from the supplied HDRI's brightest pixel

/* =====================================================================
   1. DOM, STATE, DIAGNOSTICS
   ===================================================================== */
const $=id=>document.getElementById(id);
const canvas=$('c'),stageEl=$('stage');
const state={t:0,playing:false,rate:1,flow:true,press:true,vec:true,labels:true,cut:false,simple:false,inspect:false,debug:false,
  sound:true,volume:.7,voice:false,quality:'med',recording:false,loaded:false,lastScene:-1};
const diag={fbx:'pending',hdr:'pending',ground:'pending',audio:'pending',missing:[],notes:[],wheels:{},anchors:{},meshes:0,tris:0,materials:0};
const loadUI={bar:$('loadBar'),txt:$('loadTxt'),err:$('loadErr')};
function showError(msg){loadUI.err.textContent=(loadUI.err.textContent?loadUI.err.textContent+'\n':'')+msg;console.error(msg)}

/* =====================================================================
   2. RENDERER / SCENE / CAMERA
   ===================================================================== */
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:false});
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.85;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.localClippingEnabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#8d939b');
scene.fog=new THREE.FogExp2(new THREE.Color('#8d939b'),0.0022);
const camera=new THREE.PerspectiveCamera(50,9/16,0.05,1500);
scene.add(camera);
const controls=new OrbitControls(camera,canvas);controls.enabled=false;controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI*0.52;controls.minDistance=1.2;controls.maxDistance=40;
const QUALITY={low:{pr:1,shadow:1024,part:.5},med:{pr:1.5,shadow:2048,part:.8},high:{pr:2,shadow:4096,part:1}};
const sun=new THREE.DirectionalLight(0xfff3e0,1.9);sun.castShadow=true;
sun.shadow.camera.left=-6;sun.shadow.camera.right=6;sun.shadow.camera.top=6;sun.shadow.camera.bottom=-6;sun.shadow.camera.near=1;sun.shadow.camera.far=70;
sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.025;
scene.add(sun,sun.target);
scene.add(new THREE.HemisphereLight(0xcfe3ff,0x403a33,0.25));
let outW=1080,outH=1920;
function setQuality(q){
  state.quality=q;const Q=QUALITY[q];
  sun.shadow.mapSize.set(Q.shadow,Q.shadow);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}
  resize();
}
function resize(){
  if(state.recording)return;
  const wrap=$('stageWrap'),W=wrap.clientWidth-8,H=wrap.clientHeight-8;
  const w=Math.floor(Math.max(120,Math.min(W,H*9/16))),h=Math.floor(w*16/9);
  stageEl.style.width=w+'px';stageEl.style.height=h+'px';
  const pr=Math.min(window.devicePixelRatio||1,QUALITY[state.quality].pr);
  renderer.setPixelRatio(pr);renderer.setSize(w,h,false);
  camera.aspect=9/16;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

/* =====================================================================
   3. ASSET LOADING
   ===================================================================== */
const manager=new THREE.LoadingManager();
manager.onProgress=(url,loaded,total)=>{loadUI.bar.style.width=(100*loaded/Math.max(1,total))+'%';loadUI.txt.textContent=url.split('/').pop()+'  ('+loaded+'/'+total+')'};
manager.onError=url=>{diag.missing.push(url);showError('Failed to load: '+url)};
const texLoader=new THREE.TextureLoader(manager);
const loadTex=u=>new Promise((res,rej)=>texLoader.load(u,res,undefined,rej));
const maxAniso=()=>Math.min(16,renderer.capabilities.getMaxAnisotropy());

async function loadEnvironment(){
  const pm=new THREE.PMREMGenerator(renderer);
  try{
    const hdr=await new Promise((res,rej)=>new RGBELoader(manager).load(ASSET+'sky.hdr',res,undefined,rej));
    hdr.mapping=THREE.EquirectangularReflectionMapping;
    scene.environment=pm.fromEquirectangular(hdr).texture;
    scene.background=hdr;scene.backgroundIntensity=1.0;scene.environmentIntensity=1.0;
    diag.hdr='ok: assets/sky.hdr (converted from kloppenheim_03_puresky_2k.exr, '+hdr.image.width+'×'+hdr.image.height+')';
  }catch(e){
    diag.hdr='FAILED ('+(e&&e.message||e)+') — using RoomEnvironment fallback';showError('HDRI: '+diag.hdr);
    scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
  }
  pm.dispose();
}

let ground,groundMat;
async function loadGround(){
  groundMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,metalness:0});
  try{
    const [d,n,r]=await Promise.all([loadTex(ASSET+'asphalt_diff.jpg'),loadTex(ASSET+'asphalt_nor.jpg'),loadTex(ASSET+'asphalt_rough.jpg')]);
    const rep=600/5;                                    // one texture tile = 5 m ; 600 m plane ; plane snaps to 5 m steps
    for(const tx of [d,n,r]){tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(rep,rep);tx.anisotropy=maxAniso()}
    d.colorSpace=THREE.SRGBColorSpace;n.colorSpace=THREE.NoColorSpace;r.colorSpace=THREE.NoColorSpace;
    groundMat.map=d;groundMat.normalMap=n;groundMat.normalScale.set(1.2,1.2);groundMat.roughnessMap=r;
    diag.ground='ok: diffuse + normal (GL) + roughness maps (converted from your 2k EXR/JPG). Displacement webp NOT used (flat road).';
  }catch(e){diag.ground='FAILED: '+(e&&e.message||e);showError(diag.ground);groundMat.color.set(0x2b2b2d)}
  ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),groundMat);
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
}

/* ---- FBX car ---- */
const carRoot=new THREE.Group();scene.add(carRoot);
let carModel=null;
const RME_FILES=new Set(['T_Brake','T_Cabin','T_Cabin_Grid_A','T_Engine','T_Engine_Grid_B','T_Grid_A','T_Grid_B','T_Grid_C','T_Light','T_Logo','T_Rim','T_Tyre','T_tongyong']);
const rmeCache=new Map();
function packRME(src){                                // RME (R=rough,G=metal,B=emissive) -> three layout (G=rough,B=metal)

   ===================================================================== */

    const load=async f=>ctx.decodeAudioData(await (await fetch(ASSET+f)).arrayBuffer());
    const [lo,hi]=await Promise.all([load('engine_loop_low.mp3'),load('engine_loop_high.mp3')]);
    const loop=(buf)=>{const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;const g=ctx.createGain();g.gain.value=0;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=9000;s.connect(f);f.connect(g);g.connect(audio.master);s.start();return{s,g,f}};

  audio.lo.g.gain.setTargetAtTime(live*.5*(1-blend),c,k);audio.hi.g.gain.setTargetAtTime(live*.5*blend,c,k);
  audio.lo.f.frequency.setTargetAtTime(2500+6500*sp,c,k);audio.hi.f.frequency.setTargetAtTime(3500+6500*sp,c,k);
  audio.wind.g.gain.setTargetAtTime(live*.55*sp*sp*sp,c,k);audio.wind.f.frequency.setTargetAtTime(500+1500*sp,c,k);
  audio.tyre.g.gain.setTargetAtTime(live*.5*sp,c,k);
  audio.master.gain.setTargetAtTime(state.sound?state.volume:0,c,.03);
}

/* optional browser text-to-speech preview (NOT part of the exported video) */
let spoken=-1;
function voiceTick(t){
  if(!state.voice||!('speechSynthesis' in window)||!state.playing)return;
  const i=sceneAt(t);if(i!==spoken){spoken=i;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(SCENES[i].line);u.rate=1.08;speechSynthesis.speak(u)}
}

/* =====================================================================
   8. PLAYBACK ENGINE & UI
   ===================================================================== */
let lastNow=performance.now(),needsDraw=true;
function frame(now){
  requestAnimationFrame(frame);
  if(!state.loaded)return;
  let dt=Math.min(.1,(now-lastNow)/1000);lastNow=now;
  if(state.playing){
    state.t+=dt*(state.recording?1:state.rate);
    if(state.t>=DURATION){state.t=DURATION;if(state.recording)finishRecording();state.playing=false;syncPlayBtn()}
  }
  const idx=sceneAt(state.t);
  if(idx!==state.lastScene){if(state.playing&&state.lastScene>=0&&idx===state.lastScene+1)thump();state.lastScene=idx;updateSceneChips()}
  const r=applyTime(state.t);
  voiceTick(state.t);
  renderer.render(scene,camera);
  updateUI(r);
}
function updateUI(r){
  if(!uiDrag)$('scrub').value=Math.round(state.t/DURATION*1000);
  $('time').textContent=fmt(state.t)+' / '+fmt(DURATION);
  if(state.debug){
    $('debug').textContent='t='+state.t.toFixed(2)+'s  scene '+SCENES[state.lastScene].n+' · '+SCENES[state.lastScene].name+'\nspeed '+r.v.toFixed(0)+' km/h  dist '+r.s.toFixed(0)+' m\ncam '+camera.position.toArray().map(x=>x.toFixed(1)).join(', ')+' fov '+camera.fov.toFixed(0)+'\nFBX: '+diag.fbx.slice(0,40)+'…\nHDRI: '+diag.hdr.slice(0,40)+'\nground: '+diag.ground.slice(0,40)+'\naudio: '+diag.audio.slice(0,40)+'\nwheels: '+Object.keys(diag.wheels).join(' ')+'\nmeshes '+diag.meshes+'  tris '+Math.round(diag.tris/1000)+'k\ndraw calls '+renderer.info.render.calls+'\nmissing: '+(diag.missing.length||'none');
  }
}
let uiDrag=false;
const syncPlayBtn=()=>{$('btnPlay').textContent=state.playing?'❚❚':'▶'};
function updateSceneChips(){document.querySelectorAll('#sceneChips button').forEach((b,i)=>b.classList.toggle('on',i===state.lastScene));$('sceneLbl').textContent='Scene '+SCENES[Math.max(0,state.lastScene)].n+' / '+SCENES.length+' — '+SCENES[Math.max(0,state.lastScene)].name}
function seek(t){state.t=clamp(t,0,DURATION);spoken=-1;if('speechSynthesis' in window)speechSynthesis.cancel();state.lastScene=sceneAt(state.t);updateSceneChips()}
async function play(){
  await initAudio();if(audio.ctx&&audio.ctx.state==='suspended')await audio.ctx.resume();
  if(state.t>=DURATION-.01)seek(0);
  state.playing=true;syncPlayBtn();$('tapHint').style.opacity=0;if('speechSynthesis' in window)speechSynthesis.resume();
}
function pause(){state.playing=false;syncPlayBtn();if('speechSynthesis' in window)speechSynthesis.pause()}
function bindUI(){
  $('btnPlay').onclick=()=>state.playing?pause():play();
  $('btnRestart').onclick=()=>{seek(0);if(!state.playing)play()};
  const sc=$('scrub');sc.oninput=()=>{uiDrag=true;seek(sc.value/1000*DURATION)};sc.onchange=()=>{uiDrag=false};sc.onpointerup=()=>{uiDrag=false};
  $('btnPanel').onclick=()=>$('panel').classList.toggle('open');
  const sceneChips=$('sceneChips');SCENES.forEach((S,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=S.n;b.title=S.name;b.onclick=()=>seek(S.t0+.001);sceneChips.appendChild(b)});
  const tog=(id,key,cb)=>{const b=$(id);b.onclick=()=>{state[key]=!state[key];b.classList.toggle('on',state[key]);cb&&cb()}};
  tog('tFlow','flow');tog('tPress','press');tog('tVec','vec');tog('tLbl','labels');tog('tSimple','simple');
  tog('tCut','cut');tog('tDebug','debug',()=>{$('debug').style.display=state.debug?'block':'none'});
  tog('tInspect','inspect',()=>{controls.enabled=state.inspect;if(state.inspect)resetInspectCam()});
  $('btnResetCam').onclick=()=>{if(state.inspect)resetInspectCam();else $('tInspect').click()};
  tog('tSound','sound',()=>{$('tSound').textContent=state.sound?'Sound on':'Sound off'});
  $('vol').oninput=e=>{state.volume=e.target.value/100};
  tog('tVoice','voice',()=>{if(!state.voice&&'speechSynthesis' in window)speechSynthesis.cancel();spoken=-1});
  $('selSpeed').onchange=e=>state.rate=+e.target.value;
  $('selQuality').onchange=e=>setQuality(e.target.value);
  $('btnRec').onclick=()=>state.recording?finishRecording(true):startRecording();
  document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('btnPlay').click()}if(e.code==='ArrowRight')seek(state.t+2);if(e.code==='ArrowLeft')seek(state.t-2)});
  document.addEventListener('visibilitychange',()=>{lastNow=performance.now()});
}
function resetInspectCam(){
  const p=carPos.clone();camera.position.set(p.x-6.5,2.2,p.z+7.5);controls.target.set(p.x,.6,p.z);camera.fov=45;camera.updateProjectionMatrix();controls.update();inspectInit=true;lastCar.copy(carPos);
}

/* ---- real video recording: canvas.captureStream + Web Audio destination + MediaRecorder ---- */
let rec=null,recChunks=[],recMime='';
function pickMime(){
  const c=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return window.MediaRecorder?c.find(m=>MediaRecorder.isTypeSupported(m))||'':'';
}
async function startRecording(){
  const st=$('status');
  if(!window.MediaRecorder||!canvas.captureStream){st.textContent='This browser has no MediaRecorder/canvas.captureStream — recording unavailable.';return}
  recMime=pickMime();if(!recMime){st.textContent='No supported recording MIME type found.';return}
  await initAudio();if(audio.ctx&&audio.ctx.state==='suspended')await audio.ctx.resume();
  state.recording=true;state.inspect=false;controls.enabled=false;$('tInspect').classList.remove('on');state.debug=false;$('debug').style.display='none';
  const w=+$('selRes').value,h=Math.round(w*16/9);
  renderer.setPixelRatio(1);renderer.setSize(w,h,false);camera.aspect=9/16;camera.updateProjectionMatrix();
  const stream=canvas.captureStream(30);let withAudio=false;
  if(audio.ready&&state.sound){audio.rec.stream.getAudioTracks().forEach(t=>stream.addTrack(t));withAudio=true}
  try{rec=new MediaRecorder(stream,{mimeType:recMime,videoBitsPerSecond:w>=1080?14e6:7e6,audioBitsPerSecond:192000})}
  catch(e){st.textContent='Recorder error: '+e.message;state.recording=false;resize();return}
  recChunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
  rec.onerror=e=>{st.textContent='Recording error: '+(e.error&&e.error.message||'unknown')};
  rec.onstop=()=>{
    const blob=new Blob(recChunks,{type:recMime.split(';')[0]}),ext=recMime.includes('mp4')?'mp4':'webm',url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='jesko-attack-downforce.'+ext;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    st.textContent='Saved jesko-attack-downforce.'+ext+' ('+(blob.size/1e6).toFixed(1)+' MB, '+recMime.split(';')[0]+', '+w+'×'+h+', audio '+(withAudio?'included':'NOT included')+'). Download started.';
    recChunks=[];stream.getTracks().forEach(t=>t.stop());state.recording=false;rec=null;$('recBadge').style.display='none';$('btnRec').textContent='● Record video';$('btnRec').classList.remove('rec');resize();
  };
  st.textContent='Recording '+w+'×'+h+' ('+recMime.split(';')[0]+', audio '+(withAudio?'on':'OFF — sound is muted or unavailable')+')… keep this tab visible.';
  $('recBadge').style.display='block';$('btnRec').textContent='■ Stop & save';$('btnRec').classList.add('rec');
  seek(0);state.playing=true;syncPlayBtn();lastNow=performance.now();rec.start(500);
}
function finishRecording(){if(rec&&rec.state!=='inactive'){setTimeout(()=>rec&&rec.state!=='inactive'&&rec.stop(),250)}}

/* =====================================================================
   9. START-UP
   ===================================================================== */
async function main(){
  try{
    bindUI();resize();setQuality('med');
    await loadEnvironment();await loadGround();await loadCar();
    loadUI.txt.textContent='measuring geometry…';
    buildWheels();measureProfile();buildDebug();buildRoadMarks();buildFlow();buildBlobs();buildArrows();buildLabels();buildHUD();
    // soft contact shadow under the car
    const cs=document.createElement('canvas');cs.width=cs.height=128;const x=cs.getContext('2d'),g=x.createRadialGradient(64,64,6,64,64,64);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);
    const blob=new THREE.Mesh(new THREE.PlaneGeometry(2.7,5.4).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cs),transparent:true,depthWrite:false,fog:false,polygonOffset:true,polygonOffsetFactor:-3}));blob.position.y=.01;carRoot.add(blob);
    state.loaded=true;state.lastScene=0;updateSceneChips();applyTime(0);
    $('loading').style.display='none';$('tapHint').style.opacity=1;
    window.__jesko={state,diag,seek,play,pause,applyTime,SCENES,P,wheels,camera,scene,renderer};
    console.log('[Jesko] diagnostics',JSON.parse(JSON.stringify(diag)));
  }catch(e){
    showError('FATAL: '+(e&&e.stack||e));loadUI.txt.textContent='Could not start — see error below. Serve the folder over HTTP (python3 -m http.server) and check the console.';
  }
}
requestAnimationFrame(frame);
main();
</script>
